ownership_finding: >-
  The only 200 on the discovery surface belongs to Salesforce, so no `WellKnown`
  and no `SecurityTxt` common[] pointer is emitted. Recording the absence is the
  measurement; asserting a pointer would credit Moosend with a well-known
  catalogue it does not serve.

gap_for_provider: >-
  Moosend publishes a vulnerability disclosure policy at
  https://moosend.com/privacy-policy/disclosure/ but does not surface it at
  /.well-known/security.txt (RFC 9116). Serving a three-line security.txt naming
  that policy URL would make an existing programme machine-discoverable.
