summary:
  real_documents: 1
  real_documents_owned_by_moosend: 0
  note: >-
    Moosend serves no /.well-known/ discovery surface of its own. The single 200
    on these paths is an OpenID Connect discovery document at docs.moosend.com —
    and it is not Moosend's: its issuer is https://login.salesforce.com, because
    docs.moosend.com is a Salesforce Experience Cloud help centre. It describes
    the Salesforce identity provider behind the docs portal, not the Moosend API,
    which authenticates with an `apikey` query-string parameter and has no OAuth
    or OIDC surface at all. No WellKnown pointer is emitted in apis.yml for that
    reason — see ownership_finding below.

