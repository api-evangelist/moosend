notes:
  - >-
    Subscriber is scoped to a MailingList, not to the account — the same person on
    two lists is two Subscriber records with two ids. Only
    unsubscribingSubscribersFromAccount operates across lists.
  - >-
    A Segment is defined on a list and evaluated by its Criteria; segment
    membership is read through gettingSegmentSubscribers rather than stored.
  - >-
    Automations, landing pages, forms and the SMTP/transactional surface appear
    in the product and on the status page but have no operations in the published
    v3 contract, so they are absent from this model.
