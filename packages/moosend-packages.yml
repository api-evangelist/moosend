    version: v3.0.0+incompatible
    published: '2017-10-03'
    source_code: https://github.com/moosend/api-wrappers-go
    covers: Moosend API v3
    note: Read from proxy.golang.org/@latest. No go.mod — resolves as +incompatible.

  - language: python
