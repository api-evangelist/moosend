generated: '2026-08-13'
method: searched
source: >-
  Public registry metadata endpoints (registry.npmjs.org, api.nuget.org,
  packagist.org, proxy.golang.org, pypi.org, rubygems.org) plus the Moosend
  GitHub organization at https://github.com/moosend
note: >-
  Moosend generated a first-party client wrapper for nine languages in October
  2017 (swagger-codegen against the v3 contract — the .swagger-codegen markers
  are still committed in the Go and Java repos). Only a subset was ever pushed
  to a package registry; the rest exist only as GitHub source, and two of the
  advertised repos (Scala, Swift) are empty. Every API wrapper's newest published
  release predates 2018 apart from the PHP wrapper (2020). The actively maintained
  packages are the tracking and UI libraries, not the API SDKs.

packages:
  # ---- first-party API wrappers -------------------------------------------
  - language: javascript
    registry: npm
    name: moosend-api
    url: https://www.npmjs.com/package/moosend-api
    install: npm install moosend-api
    official: true
    version: 3.0.1
    published: '2017-10-03'
    source_code: https://github.com/moosend/api-wrappers-js
    covers: Moosend API v3
    note: >-
      Last publish 2017-10-03. package.json `repository` points at a personal
      fork (github.com/mooTheo/Javascript-Moosend-Wrapper), not the org repo.

  - language: csharp
    registry: nuget
    name: moosend-api-wrapper
    url: https://www.nuget.org/packages/moosend-api-wrapper/
    install: dotnet add package moosend-api-wrapper
    official: true
    version: 3.0.1.31
    published: '2017-12-22'
    authors: Moosend Ltd
    source_code: https://github.com/moosend/api-wrappers-dotnet
    covers: Moosend API v3

  - language: csharp
