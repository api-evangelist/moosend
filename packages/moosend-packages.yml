    version: 3.0.0
    published: '2017-10-03'
    authors: moosend
    source_code: https://github.com/moosend/api-wrappers-dotnet
    covers: Moosend API v3
    note: Duplicate of moosend-api-wrapper under a second package id.

  - language: csharp
    registry: nuget
    name: moosend
