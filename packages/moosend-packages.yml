currency:
  api_sdk_newest_release: '2020-02-25'
  api_sdk_newest_package: moosend/phpwrapper
  languages_with_published_api_sdk: [javascript, csharp, php, go]
  languages_source_only: [python, java, ruby]
  languages_advertised_but_empty: [scala, swift]
  finding: >-
    Every published Moosend API client is at least five years old and seven of
    the nine advertised wrappers are either unpublished or empty. The v3 REST
    contract itself was last edited in Apiary on 2022-03-16.
