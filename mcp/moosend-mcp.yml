high_consequence_tools:
  - tool: send_campaign
    reason: Delivers email to a real audience. Cannot be recalled once sent.
  - tool: unsubscribe_from_account
    reason: Removes an address from every list in the account.
  - tool: delete_mailing_list
    reason: Destructive and account-wide.

high_consequence_note: >-
  Any deployment of this candidate set should gate the tools above behind human
  confirmation — the API offers no scoped credential to enforce it.
