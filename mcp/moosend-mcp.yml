auth_model:
  scheme: apiKey
  location: query
  parameter: apikey
  note: >-
    Any MCP server built over this API would carry a single account-wide API key
    with no scopes — every tool below would have full read/write authority over
    every list, subscriber and campaign in the account. There is no way to issue
    a reduced-privilege credential to an agent.

